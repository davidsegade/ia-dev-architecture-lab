name: 'IA DEV Failure'
description: 'Report IA DEV failure and trigger retry if applicable'
inputs:
  target-repo:
    description: 'Target repository'
    required: true
  target-token:
    description: 'Token for target repo'
    required: true
  base-sha:
    description: 'Base SHA'
    required: true
  issue-number:
    description: 'Issue number'
    required: true
  skip:
    description: 'Whether execution was skipped'
    required: true
  prepare-result:
    description: 'Prepare job result'
    required: true
  publish-result:
    description: 'Publish job result'
    required: true
outputs:
  retry:
    description: 'Whether the controller allows another attempt for this issue'
    value: ${{ steps.failure.outputs.retry }}
  failures:
    description: 'Number of failed runs recorded on the issue'
    value: ${{ steps.failure.outputs.failures }}
runs:
  using: 'composite'
  steps:
    - name: Checkout target repo at base SHA
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4.4.0
      with:
        repository: ${{ inputs.target-repo }}
        ref: ${{ inputs.base-sha }}
        persist-credentials: false
        path: target
    - name: Checkout controller repo
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4.4.0
      with:
        repository: davidsegade/ia-dev-architecture-lab
        ref: main
        path: ia-dev
        persist-credentials: false
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4.4.0
      with:
        node-version: '24'
    - name: Download artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: '*'
        merge-multiple: true
        path: target/bundle
    - name: Report failure
      id: failure
      run: node "$IA_DEV_ENGINE"/controller/github.mjs failure
      shell: bash
      working-directory: target
      env:
        IA_DEV_ENGINE: ${{ github.workspace }}/ia-dev
        GH_TOKEN: ${{ inputs.target-token }}
        GITHUB_REPOSITORY: ${{ inputs.target-repo }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
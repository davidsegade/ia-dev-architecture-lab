name: 'IA DEV Prepare'
description: 'Prepare IA DEV execution: validate repo, load config, extract task, check duplicates'
inputs:
  target-repo:
    description: 'Target repository (owner/name)'
    required: true
  target-token:
    description: 'Token for target repo (GITHUB_TOKEN from caller)'
    required: true
  issue-number:
    description: 'Issue number to process'
    required: true
  automatic:
    description: 'Automatic retry marker'
    required: false
    default: 'false'
outputs:
  task:
    description: 'Task name to execute'
    value: ${{ steps.prepare.outputs.task }}
  issue:
    description: 'Issue number'
    value: ${{ steps.prepare.outputs.issue }}
  base:
    description: 'Base SHA'
    value: ${{ steps.prepare.outputs.base }}
  skip:
    description: 'Whether to skip execution'
    value: ${{ steps.prepare.outputs.skip }}
  feedback:
    description: 'Previous feedback for retry'
    value: ${{ steps.prepare.outputs.feedback }}
  target-config:
    description: 'JSON config for target repo'
    value: ${{ steps.prepare.outputs.target-config }}
runs:
  using: 'composite'
  steps:
    - name: Checkout controller repo (ia-dev-architecture-lab)
      uses: actions/checkout@v4
      with:
        repository: davidsegade/ia-dev-architecture-lab
        ref: main
        path: ia-dev
        persist-credentials: false
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Run architecture tests
      run: npm run test:architecture
      shell: bash
      working-directory: ia-dev
    - name: Prepare
      id: prepare
      run: |
        node "$IA_DEV_ENGINE"/controller/github.mjs prepare
      shell: bash
      env:
        IA_DEV_ENGINE: ${{ github.workspace }}/ia-dev
        GH_TOKEN: ${{ inputs.target-token }}
        GITHUB_REPOSITORY: ${{ inputs.target-repo }}
        GITHUB_EVENT_PATH: ${{ runner.temp }}/event.json
    - name: Set outputs
      shell: bash
      env:
        OUT_TASK: ${{ steps.prepare.outputs.task }}
        OUT_ISSUE: ${{ steps.prepare.outputs.issue }}
        OUT_BASE: ${{ steps.prepare.outputs.base }}
        OUT_SKIP: ${{ steps.prepare.outputs.skip }}
        OUT_FEEDBACK: ${{ steps.prepare.outputs.feedback }}
        OUT_TARGET_CONFIG: ${{ steps.prepare.outputs.target-config }}
      run: |
        {
          echo "task=$OUT_TASK"
          echo "issue=$OUT_ISSUE"
          echo "base=$OUT_BASE"
          echo "skip=$OUT_SKIP"
          echo "feedback=$OUT_FEEDBACK"
          echo 'target-config<<IA_DEV_CONFIG_EOF'
          echo "$OUT_TARGET_CONFIG"
          echo 'IA_DEV_CONFIG_EOF'
        } >> "$GITHUB_OUTPUT"
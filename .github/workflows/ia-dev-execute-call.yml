name: 'IA DEV Execute (call)'
on:
  workflow_call:
    inputs:
      target-repo:
        description: 'Target repository (owner/name)'
        required: true
        type: string
      issue-number:
        description: 'Issue number to process'
        required: true
        type: string
      automatic:
        description: 'Automatic retry marker'
        required: false
        default: 'false'
        type: string
    secrets:
      target-token:
        description: 'Token for target repo (GITHUB_TOKEN from caller)'
        required: true

permissions:
  contents: read

concurrency:
  group: ia-dev-${{ inputs.target-repo }}-${{ inputs.issue-number }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      task: ${{ steps.prepare.outputs.task }}
      issue: ${{ steps.prepare.outputs.issue }}
      base: ${{ steps.prepare.outputs.base }}
      skip: ${{ steps.prepare.outputs.skip }}
      feedback: ${{ steps.prepare.outputs.feedback }}
      target-config: ${{ steps.prepare.outputs.target-config }}
    steps:
      - name: Checkout ia-dev-architecture-lab (for composite actions)
        uses: actions/checkout@v4
        with:
          repository: davidsegade/ia-dev-architecture-lab
          ref: main
          path: ia-dev
          persist-credentials: false
      - name: Checkout target repo at base (will be determined)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target-repo }}
          ref: main
          path: target
          persist-credentials: false
      - name: Prepare event payload
        run: |
          cat > $RUNNER_TEMP/event.json <<'EOF'
          {
            "event": "workflow_dispatch",
            "inputs": {
              "issue": "${{ inputs.issue-number }}",
              "automatic": "${{ inputs.automatic }}"
            }
          }
          EOF
      - name: IA DEV Prepare
        uses: ./ia-dev/.github/actions/ia-dev-prepare
        with:
          target-repo: ${{ inputs.target-repo }}
          target-token: ${{ secrets.target-token }}
          issue-number: ${{ inputs.issue-number }}
          automatic: ${{ inputs.automatic }}
        id: prepare

  execute:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout ia-dev-architecture-lab
        uses: actions/checkout@v4
        with:
          repository: davidsegade/ia-dev-architecture-lab
          ref: main
          path: ia-dev
          persist-credentials: false
      - name: Checkout target repo at base SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target-repo }}
          ref: ${{ needs.prepare.outputs.base }}
          path: target
          persist-credentials: false
      - name: IA DEV Execute
        uses: ./ia-dev/.github/actions/ia-dev-execute
        with:
          task: ${{ needs.prepare.outputs.task }}
          target-repo: ${{ inputs.target-repo }}
          target-token: ${{ secrets.target-token }}
          feedback-base64: ${{ needs.prepare.outputs.feedback }}
          allowed-paths: ${{ fromJson(needs.prepare.outputs.target-config).allowed_paths }}
          acceptance-command: ${{ fromJson(needs.prepare.outputs.target-config).acceptance_command }}
          build-command: ${{ fromJson(needs.prepare.outputs.target-config).build_command }}
          workspace-root: ${{ fromJson(needs.prepare.outputs.target-config).workspace_root }}

  verify:
    needs: [prepare, execute]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - name: Checkout ia-dev-architecture-lab
        uses: actions/checkout@v4
        with:
          repository: davidsegade/ia-dev-architecture-lab
          ref: main
          path: ia-dev
          persist-credentials: false
      - name: Checkout target repo at base SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target-repo }}
          ref: ${{ needs.prepare.outputs.base }}
          path: target
          persist-credentials: false
      - name: Download execution artifact
        uses: actions/download-artifact@v4
        with:
          name: execution
          path: target/bundle
      - name: IA DEV Verify
        uses: ./ia-dev/.github/actions/ia-dev-verify
        with:
          task: ${{ needs.prepare.outputs.task }}
          target-repo: ${{ inputs.target-repo }}
          target-token: ${{ secrets.target-token }}
          base-sha: ${{ needs.prepare.outputs.base }}
          allowed-paths: ${{ fromJson(needs.prepare.outputs.target-config).allowed_paths }}
          acceptance-command: ${{ fromJson(needs.prepare.outputs.target-config).acceptance_command }}
          build-command: ${{ fromJson(needs.prepare.outputs.target-config).build_command }}
          workspace-root: ${{ fromJson(needs.prepare.outputs.target-config).workspace_root }}
        id: verify
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance
          path: target/bundle/acceptance-result.json
          retention-days: 7

  review:
    needs: [prepare, execute, verify]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout ia-dev-architecture-lab
        uses: actions/checkout@v4
        with:
          repository: davidsegade/ia-dev-architecture-lab
          ref: main
          path: ia-dev
          persist-credentials: false
      - name: Checkout target repo at base SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target-repo }}
          ref: ${{ needs.prepare.outputs.base }}
          path: target
          persist-credentials: false
      - name: Download execution artifact
        uses: actions/download-artifact@v4
        with:
          name: execution
          path: target/bundle
      - name: IA DEV Review
        uses: ./ia-dev/.github/actions/ia-dev-review
        with:
          task: ${{ needs.prepare.outputs.task }}
          target-repo: ${{ inputs.target-repo }}
          target-token: ${{ secrets.target-token }}
          base-sha: ${{ needs.prepare.outputs.base }}
          allowed-paths: ${{ fromJson(needs.prepare.outputs.target-config).allowed_paths }}
          acceptance-command: ${{ fromJson(needs.prepare.outputs.target-config).acceptance_command }}
          build-command: ${{ fromJson(needs.prepare.outputs.target-config).build_command }}
          workspace-root: ${{ fromJson(needs.prepare.outputs.target-config).workspace_root }}

  publish:
    needs: [prepare, execute, verify, review]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    outputs:
      pr-url: ${{ steps.publish.outputs.pr-url }}
      pr-sha: ${{ steps.publish.outputs.pr-sha }}
    steps:
      - name: Checkout ia-dev-architecture-lab
        uses: actions/checkout@v4
        with:
          repository: davidsegade/ia-dev-architecture-lab
          ref: main
          path: ia-dev
          persist-credentials: false
      - name: Checkout target repo at base SHA (with write)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target-repo }}
          ref: ${{ needs.prepare.outputs.base }}
          path: target
          persist-credentials: true
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: target/bundle
      - name: IA DEV Publish
        uses: ./ia-dev/.github/actions/ia-dev-publish
        with:
          target-repo: ${{ inputs.target-repo }}
          target-token: ${{ secrets.target-token }}
          base-sha: ${{ needs.prepare.outputs.base }}
          expected-digest: ${{ needs.verify.outputs.digest }}
          allowed-paths: ${{ fromJson(needs.prepare.outputs.target-config).allowed_paths }}
          task: ${{ needs.prepare.outputs.task }}
        id: publish
      - name: Upload publication artifact
        uses: actions/upload-artifact@v4
        with:
          name: publication
          path: target/bundle/publication.json
          retention-days: 7

  report-failure:
    needs: [prepare, execute, verify, review, publish]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false' && needs.publish.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: Checkout ia-dev-architecture-lab
        uses: actions/checkout@v4
        with:
          repository: davidsegade/ia-dev-architecture-lab
          ref: main
          path: ia-dev
          persist-credentials: false
      - name: Checkout target repo at base SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target-repo }}
          ref: ${{ needs.prepare.outputs.base }}
          path: target
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*'
          merge-multiple: true
          path: target/bundle
      - name: IA DEV Failure
        uses: ./ia-dev/.github/actions/ia-dev-failure
        with:
          target-repo: ${{ inputs.target-repo }}
          target-token: ${{ secrets.target-token }}
          base-sha: ${{ needs.prepare.outputs.base }}
          issue-number: ${{ inputs.issue-number }}
          skip: ${{ needs.prepare.outputs.skip }}
          prepare-result: ${{ needs.prepare.result }}
          publish-result: ${{ needs.publish.result }}
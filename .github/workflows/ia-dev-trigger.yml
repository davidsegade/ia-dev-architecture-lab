name: 'IA DEV Trigger'
on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'ia-dev')
    runs-on: ubuntu-24.04
    steps:
      - name: Validate issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "issue=${{ github.event.inputs.issue }}" >> $GITHUB_OUTPUT
          else
            echo "issue=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi
        id: validate

  execute:
    needs: check
    if: needs.check.outputs.issue != ''
    uses: davidsegade/ia-dev-architecture-lab/.github/workflows/ia-dev-execute.yml@main
    with:
      target-repo: davidsegade/TURNEO-Flutter
      issue-number: ${{ needs.check.outputs.issue }}
    secrets:
      target-token: ${{ secrets.GITHUB_TOKEN }}
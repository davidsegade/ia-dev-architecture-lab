name: IA DEV Graphify lock bootstrap

on:
  pull_request:
    paths:
      - "toolchain/graphify-requirements.in"
      - "toolchain/graphify-requirements.lock"
      - ".github/workflows/bootstrap-graphify-lock.yml"

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Create isolated Python environment
        run: python3 -m venv "$RUNNER_TEMP/graphify-lock"
      - name: Install committed Graphify lock exactly
        run: "$RUNNER_TEMP/graphify-lock/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps -r toolchain/graphify-requirements.lock
      - name: Verify lock resolves exact Graphify version
        run: |
          test "$("$RUNNER_TEMP/graphify-lock/bin/python" -c 'import importlib.metadata; print(importlib.metadata.version("graphifyy"))')" = "0.9.80"
      - name: Smoke-test real code-only extraction
        run: |
          mkdir -p "$RUNNER_TEMP/graphify-smoke/input"
          printf 'export function createRoute(x) { return x; }\n' > "$RUNNER_TEMP/graphify-smoke/input/route.js"
          "$RUNNER_TEMP/graphify-lock/bin/graphify" extract "$RUNNER_TEMP/graphify-smoke/input" --code-only --no-cluster --max-workers 1 --out "$RUNNER_TEMP/graphify-smoke/output"
          node -e 'const fs=require("fs");const p=process.env.RUNNER_TEMP+"/graphify-smoke/output/graphify-out/graph.json";const g=JSON.parse(fs.readFileSync(p,"utf8"));if(g.graph?.schema_version!==1||g.graph?.graphify_version!=="0.9.80"||!Array.isArray(g.nodes)||g.nodes.length===0)process.exit(1);console.log(JSON.stringify({schema:g.graph.schema_version,version:g.graph.graphify_version,nodes:g.nodes.length}));'

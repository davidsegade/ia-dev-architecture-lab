name: 'IA DEV Execute'
on:
  workflow_dispatch:
    inputs:
      target-repo:
        description: 'Target repository (owner/name)'
        required: true
        type: string
      issue-number:
        description: 'Issue number to process'
        required: true
        type: string
      automatic:
        description: 'Automatic retry marker'
        required: false
        default: 'false'
        type: string
  workflow_call:
    inputs:
      target-repo:
        description: 'Target repository (owner/name)'
        required: true
        type: string
      issue-number:
        description: 'Issue number to process'
        required: true
        type: string
      automatic:
        description: 'Automatic retry marker'
        required: false
        default: 'false'
        type: string
    secrets:
      target-token:
        description: 'Token for target repo (GITHUB_TOKEN from caller)'
        required: true

permissions:
  contents: read

concurrency:
  group: ia-dev-${{ inputs.target-repo || github.event.inputs.target-repo }}-${{ inputs.issue-number || github.event.inputs.issue-number }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      task: ${{ steps.prepare.outputs.task }}
      issue: ${{ steps.prepare.outputs.issue }}
      base: ${{ steps.prepare.outputs.base }}
      skip: ${{ steps.prepare.outputs.skip }}
      feedback: ${{ steps.prepare.outputs.feedback }}
      target-config: ${{ steps.prepare.outputs.target-config }}
    steps:
      - name: Prepare event payload
        run: |
          cat > $RUNNER_TEMP/event.json <<'EOF'
          {
            "event": "workflow_dispatch",
            "inputs": {
              "issue": "${{ inputs.issue-number || github.event.inputs.issue-number }}",
              "automatic": "${{ inputs.automatic || github.event.inputs.automatic }}"
            }
          }
          EOF
      - name: IA DEV Prepare
        uses: davidsegade/ia-dev-architecture-lab/.github/actions/ia-dev-prepare@38f48a53e8253ebc05172b4d0019e1b91f9d83b7
        with:
          target-repo: ${{ inputs.target-repo || github.event.inputs.target-repo }}
          target-token: ${{ secrets.target-token || github.token }}
          issue-number: ${{ inputs.issue-number || github.event.inputs.issue-number }}
          automatic: ${{ inputs.automatic || github.event.inputs.automatic }}
        id: prepare

  execute:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: IA DEV Execute
        uses: davidsegade/ia-dev-architecture-lab/.github/actions/ia-dev-execute@38f48a53e8253ebc05172b4d0019e1b91f9d83b7
        with:
          task: ${{ needs.prepare.outputs.task }}
          target-repo: ${{ inputs.target-repo || github.event.inputs.target-repo }}
          target-token: ${{ secrets.target-token || github.token }}
          feedback-base64: ${{ needs.prepare.outputs.feedback }}
          allowed-paths: ${{ fromJson(needs.prepare.outputs.target-config).allowed_paths }}
          acceptance-command: ${{ fromJson(needs.prepare.outputs.target-config).acceptance_command }}
          build-command: ${{ fromJson(needs.prepare.outputs.target-config).build_command }}
          workspace-root: ${{ fromJson(needs.prepare.outputs.target-config).workspace_root }}

  verify:
    needs: [prepare, execute]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - name: IA DEV Verify
        uses: davidsegade/ia-dev-architecture-lab/.github/actions/ia-dev-verify@38f48a53e8253ebc05172b4d0019e1b91f9d83b7
        with:
          task: ${{ needs.prepare.outputs.task }}
          target-repo: ${{ inputs.target-repo || github.event.inputs.target-repo }}
          target-token: ${{ secrets.target-token || github.token }}
          base-sha: ${{ needs.prepare.outputs.base }}
          allowed-paths: ${{ fromJson(needs.prepare.outputs.target-config).allowed_paths }}
          acceptance-command: ${{ fromJson(needs.prepare.outputs.target-config).acceptance_command }}
          build-command: ${{ fromJson(needs.prepare.outputs.target-config).build_command }}
          workspace-root: ${{ fromJson(needs.prepare.outputs.target-config).workspace_root }}
        id: verify

  review:
    needs: [prepare, execute, verify]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: IA DEV Review
        uses: davidsegade/ia-dev-architecture-lab/.github/actions/ia-dev-review@38f48a53e8253ebc05172b4d0019e1b91f9d83b7
        with:
          task: ${{ needs.prepare.outputs.task }}
          target-repo: ${{ inputs.target-repo || github.event.inputs.target-repo }}
          target-token: ${{ secrets.target-token || github.token }}
          base-sha: ${{ needs.prepare.outputs.base }}
          allowed-paths: ${{ fromJson(needs.prepare.outputs.target-config).allowed_paths }}
          acceptance-command: ${{ fromJson(needs.prepare.outputs.target-config).acceptance_command }}
          build-command: ${{ fromJson(needs.prepare.outputs.target-config).build_command }}
          workspace-root: ${{ fromJson(needs.prepare.outputs.target-config).workspace_root }}

  publish:
    needs: [prepare, execute, verify, review]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    outputs:
      pr-url: ${{ steps.publish.outputs.pr-url }}
      pr-sha: ${{ steps.publish.outputs.pr-sha }}
    steps:
      - name: IA DEV Publish
        uses: davidsegade/ia-dev-architecture-lab/.github/actions/ia-dev-publish@38f48a53e8253ebc05172b4d0019e1b91f9d83b7
        with:
          target-repo: ${{ inputs.target-repo || github.event.inputs.target-repo }}
          target-token: ${{ secrets.target-token || github.token }}
          base-sha: ${{ needs.prepare.outputs.base }}
          expected-digest: ${{ needs.verify.outputs.digest }}
          allowed-paths: ${{ fromJson(needs.prepare.outputs.target-config).allowed_paths }}
          task: ${{ needs.prepare.outputs.task }}
        id: publish

  report-failure:
    needs: [prepare, execute, verify, review, publish]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false' && needs.publish.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: IA DEV Failure
        uses: davidsegade/ia-dev-architecture-lab/.github/actions/ia-dev-failure@38f48a53e8253ebc05172b4d0019e1b91f9d83b7
        with:
          target-repo: ${{ inputs.target-repo || github.event.inputs.target-repo }}
          target-token: ${{ secrets.target-token || github.token }}
          base-sha: ${{ needs.prepare.outputs.base }}
          issue-number: ${{ inputs.issue-number || github.event.inputs.issue-number }}
          skip: ${{ needs.prepare.outputs.skip }}
          prepare-result: ${{ needs.prepare.result }}
          publish-result: ${{ needs.publish.result }}
name: IA DEV laboratory

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Owner-created synthetic issue number
        required: true
        type: string
      automatic:
        description: Controller retry marker
        required: false
        default: 'false'
        type: string

# The caller grants the union of permissions the reusable workflow may need. Each job in
# the called workflow narrows this token again; it can never gain access outside this repo.
permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  actions: write

jobs:
  ia-dev:
    if: >-
      (github.actor == github.repository_owner ||
      (github.actor == 'github-actions[bot]' && github.event_name == 'workflow_dispatch' && inputs.automatic == 'true')) &&
      (github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'ia-dev') &&
      (github.event.action == 'opened' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ia-dev'))))
    uses: ./.github/workflows/ia-dev-engine.yml
    with:
      issue: ${{ github.event_name == 'workflow_dispatch' && inputs.issue || format('{0}', github.event.issue.number) }}
      caller-workflow: laboratory.yml

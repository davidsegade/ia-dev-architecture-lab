name: IA DEV laboratory
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Owner-created synthetic issue number
        required: true
        type: string
      automatic:
        description: Controller retry marker
        required: false
        default: 'false'
        type: string
permissions:
  contents: read
concurrency:
  group: ia-dev-laboratory
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    if: (github.actor == github.repository_owner || (github.actor == 'github-actions[bot]' && github.event_name == 'workflow_dispatch' && inputs.automatic == 'true')) && (github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'ia-dev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      task: ${{ steps.prepare.outputs.task }}
      issue: ${{ steps.prepare.outputs.issue }}
      base: ${{ steps.prepare.outputs.base }}
      skip: ${{ steps.prepare.outputs.skip }}
      feedback: ${{ steps.prepare.outputs.feedback }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm run test:architecture
      - id: prepare
        run: node controller/github.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
  execute:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/opencode" --no-audit --no-fund opencode-ai@1.18.34
      - run: node controller/agent.mjs write "$TASK"
        env:
          TASK: ${{ needs.prepare.outputs.task }}
          OPENCODE_BIN: ${{ runner.temp }}/opencode/node_modules/.bin/opencode
          FEEDBACK_BASE64: ${{ needs.prepare.outputs.feedback }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: execution
          path: bundle/
          retention-days: 7
  verify:
    needs: [prepare, execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: execution
          path: bundle
      - id: verify
        run: |
          node controller/gate.mjs "$TASK" bundle/change.patch > bundle/acceptance-result.json
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("bundle/acceptance-result.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT,`digest=${r.digest}\n`);'
        env:
          TASK: ${{ needs.prepare.outputs.task }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance
          path: bundle/acceptance-result.json
          retention-days: 7
  review:
    needs: [prepare, execute, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: execution
          path: bundle
      - run: node controller/gate.mjs "$TASK" bundle/change.patch
        env:
          TASK: ${{ needs.prepare.outputs.task }}
      - run: npm install --prefix "$RUNNER_TEMP/opencode" --no-audit --no-fund opencode-ai@1.18.34
      - run: node controller/agent.mjs review "$TASK"
        env:
          TASK: ${{ needs.prepare.outputs.task }}
          OPENCODE_BIN: ${{ runner.temp }}/opencode/node_modules/.bin/opencode
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review
          path: bundle/review*
          retention-days: 7
  publish:
    needs: [prepare, execute, verify, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: execution
          path: bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: review
          path: bundle
      - run: node controller/github.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DIGEST: ${{ needs.verify.outputs.digest }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication
          path: bundle/publication.json
          retention-days: 7
  report-failure:
    needs: [prepare, execute, verify, review, publish]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false' && needs.publish.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: '*'
          merge-multiple: true
          path: bundle
      - run: node controller/github.mjs failure
        env:
          GH_TOKEN: ${{ github.token }}

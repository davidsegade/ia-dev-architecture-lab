name: 'IA DEV CI'
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4.4.0
        with:
          node-version: '24'
      - run: npm run test:architecture
      - name: Temporary Graphify 0.9.80 code-only smoke
        run: |
          python3 -m venv "$RUNNER_TEMP/graphify-smoke"
          "$RUNNER_TEMP/graphify-smoke/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps -r toolchain/graphify-requirements.lock
          test "$("$RUNNER_TEMP/graphify-smoke/bin/python" -c 'import importlib.metadata; print(importlib.metadata.version("graphifyy"))')" = "0.9.80"
          mkdir -p "$RUNNER_TEMP/graphify-input"
          printf 'export function createRoute(x) { return x; }\n' > "$RUNNER_TEMP/graphify-input/route.js"
          "$RUNNER_TEMP/graphify-smoke/bin/graphify" extract "$RUNNER_TEMP/graphify-input" --code-only --no-cluster --max-workers 1 --out "$RUNNER_TEMP/graphify-output"
          node -e 'const fs=require("fs");const p=process.env.RUNNER_TEMP+"/graphify-output/graphify-out/graph.json";const g=JSON.parse(fs.readFileSync(p,"utf8"));console.log("GRAPH_META="+JSON.stringify(g.graph));if(g.graph?.schema_version!==1||!Array.isArray(g.nodes)||g.nodes.length===0)process.exit(1);console.log(JSON.stringify({schema:g.graph.schema_version,version:g.graph.graphify_version,nodes:g.nodes.length}));'
